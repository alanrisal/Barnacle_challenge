[project]
name = "barnacle-challenge"
version = "0.1.0"
description = "Barnacle region selection and instance-segmentation data preparation"
readme = "README.md"
authors = [
    { name = "genecodAlan", email = "risalgenetics@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.0",
    "opencv-python>=5.0.0.93",
    "requests>=2.34.2",
]

[project.scripts]
barnacle-challenge = "barnacle_challenge:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
